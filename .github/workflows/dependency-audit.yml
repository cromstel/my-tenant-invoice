name: Dependency Audit

on:
  schedule:
    # Mondays at 05:23 UTC - off the hour to avoid the scheduler rush.
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    name: npm audit (high & critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        # Lifecycle scripts are irrelevant for an audit and only slow it down.
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high
