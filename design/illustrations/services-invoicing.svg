  <rect x="459" y="155" width="18" height="18" rx="5" fill="#93c5fd"/>
  <rect x="491" y="155" width="18" height="18" rx="5" fill="#dbeafe"/>
  <rect x="523" y="155" width="18" height="18" rx="5" fill="#3b82f6"/>

