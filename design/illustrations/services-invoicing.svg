  <rect x="386" y="297" width="56" height="10" rx="5" fill="#cbd5e1" fill-opacity="0.6"/>
  <rect x="178" y="340" width="18" height="18" rx="5" fill="#93c5fd"/>
  <rect x="208" y="345" width="124" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="400" y="345" width="42" height="10" rx="5" fill="#cbd5e1" fill-opacity="0.6"/>

  <!-- total -->
